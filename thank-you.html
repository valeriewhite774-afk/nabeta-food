<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Confirmed | NaBetaFood</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap">

<!-- GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DHJ3K55ER3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-DHJ3K55ER3');
</script>

<style>
  :root {
    --forest: #557550;
    --dark-forest: #3A5535;
    --cream: #F7F2E5;
    --gold: #DDD6C5;
    --amber: #C8820A;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --radius: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--dark-forest);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px max(16px, env(safe-area-inset-left, 0px));
  }

  /* Subtle radial glow behind the card */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(85,117,80,.45) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    background: var(--cream);
    border-radius: var(--radius);
    box-shadow: 0 8px 48px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08) inset;
    padding: 0;
    max-width: 460px;
    width: 100%;
    overflow: hidden;
    position: relative;
  }

  /* Dark header band */
  .card-header {
    background: var(--dark-forest);
    padding: 28px 32px 32px;
    text-align: center;
    position: relative;
  }
  .card-header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 32px;
    background: var(--cream);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.3rem;
    color: var(--cream);
    letter-spacing: -.01em;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 20px;
    opacity: .85;
  }

  .check-ring {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(200,255,200,.12);
    border: 2px solid rgba(200,255,200,.3);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 2rem;
  }

  .card-header h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.75rem;
    color: var(--cream);
    letter-spacing: -.02em;
    margin-bottom: 6px;
  }
  .card-header .subtitle {
    font-size: .88rem;
    color: rgba(247,242,229,.6);
    line-height: 1.55;
    max-width: 300px;
    margin: 0 auto;
  }

  /* Card body */
  .card-body {
    padding: 28px 32px 32px;
  }

  /* Order summary table */
  .summary {
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--gold);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    font-size: .88rem;
    border-bottom: 1px solid #f0ece1;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { color: var(--muted); }
  .summary-value { font-weight: 600; color: var(--fg); }
  .summary-value.amount { color: var(--dark-forest); font-size: 1rem; }
  .summary-value.ref { font-size: .78rem; letter-spacing: .05em; color: var(--muted); font-weight: 500; }

  /* ETA pill */
  .eta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #f0f7f0;
    border: 1px solid #c4dfc4;
    border-radius: 8px;
    padding: 11px 16px;
    margin-bottom: 24px;
    font-size: .88rem;
    font-weight: 600;
    color: var(--dark-forest);
  }
  .eta-row svg { flex-shrink: 0; }

  /* CTA buttons */
  .btn-wa {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px;
    background: #25D366;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 10px;
    letter-spacing: .01em;
    transition: opacity .15s;
  }
  .btn-wa:hover { opacity: .92; }

  .btn-menu {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px;
    background: var(--dark-forest);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-decoration: none;
    letter-spacing: .01em;
    transition: opacity .15s;
  }
  .btn-menu:hover { opacity: .88; }

  .footer-note {
    text-align: center;
    font-size: .78rem;
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.6;
  }

  @media (max-width: 480px) {
    .card-header { padding: 24px 20px 28px; }
    .card-body { padding: 24px 20px 28px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <a class="logo" href="/">NaBetaFood</a>
    <div class="check-ring">✅</div>
    <h1>Order Confirmed!</h1>
    <p class="subtitle">Your food is being prepared fresh. We'll keep you posted on WhatsApp.</p>
  </div>

  <div class="card-body">
    <div class="summary">
      <div class="summary-row">
        <span class="summary-label">Item</span>
        <span class="summary-value" id="d-item">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Amount Paid</span>
        <span class="summary-value amount" id="d-amount">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Order Reference</span>
        <span class="summary-value ref" id="d-ref">—</span>
      </div>
    </div>

    <div class="eta-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="d-eta">Estimated delivery: 15–30 min</span>
    </div>

    <a class="btn-wa" href="https://wa.me/2348104063360" target="_blank" rel="noopener">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Chat with us on WhatsApp
    </a>

    <a class="btn-menu" href="/menu.html">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      Shop More Soups
    </a>

    <p class="footer-note">Save your order reference in case you need to follow up.</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const ref    = params.get('ref')    || '';
  const item   = params.get('item')   || '';
  const amount = parseInt(params.get('amount') || '0', 10);
  const qty    = parseInt(params.get('qty')    || '1', 10);

  if (item)   document.getElementById('d-item').textContent   = item;
  if (amount) document.getElementById('d-amount').textContent = '₦' + (amount / 100).toLocaleString('en-NG');
  if (ref)    document.getElementById('d-ref').textContent    = ref;

  const eta = Math.floor(Math.random() * 16) + 15;
  document.getElementById('d-eta').textContent = 'Estimated delivery: ' + eta + ' min';

  if (ref && amount) {
    gtag('event', 'purchase', {
      transaction_id: ref,
      value: amount / 100,
      currency: 'NGN',
      items: [{
        item_id: item.toLowerCase().replace(/\s+/g, '-'),
        item_name: item,
        price: amount / 100 / qty,
        quantity: qty
      }]
    });
  }
</script>
</body>
</html>
