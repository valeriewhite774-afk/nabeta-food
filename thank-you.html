<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Confirmed | NaBetaFood</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap">

<!-- GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DHJ3K55ER3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-DHJ3K55ER3');
</script>

<style>
  :root {
    --forest: #557550;
    --dark-forest: #3A5535;
    --cream: #F7F2E5;
    --amber: #C8820A;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --radius: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px max(16px, env(safe-area-inset-left, 0px));
  }
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.5rem;
    color: var(--forest);
    letter-spacing: -.01em;
    margin-bottom: 28px;
    display: block;
    text-decoration: none;
  }
  .icon { font-size: 3rem; margin-bottom: 12px; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--dark-forest);
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: .95rem;
    color: var(--muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0ece1;
    font-size: .9rem;
  }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-label { color: var(--muted); }
  .detail-value { font-weight: 600; color: var(--fg); }
  .ref-value { font-size: .8rem; letter-spacing: .04em; color: var(--muted); }
  .eta-badge {
    display: inline-block;
    background: #f0faf0;
    color: var(--dark-forest);
    border: 1px solid #c8e6c8;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: .82rem;
    font-weight: 600;
    margin: 20px 0 24px;
  }
  .btn-wa {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: #25D366;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: .95rem;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn-back {
    display: block;
    text-align: center;
    color: var(--forest);
    font-size: .88rem;
    font-weight: 500;
    text-decoration: none;
    padding: 8px;
  }
  .btn-back:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<div class="card">
  <a class="logo" href="/">NaBetaFood</a>
  <div class="icon">✅</div>
  <h1>Order Confirmed!</h1>
  <p class="subtitle">We've received your order and are getting started. Check your WhatsApp for updates.</p>

  <div class="detail-row">
    <span class="detail-label">Item</span>
    <span class="detail-value" id="d-item">—</span>
  </div>
  <div class="detail-row">
    <span class="detail-label">Amount Paid</span>
    <span class="detail-value" id="d-amount">—</span>
  </div>
  <div class="detail-row">
    <span class="detail-label">Order Reference</span>
    <span class="detail-value ref-value" id="d-ref">—</span>
  </div>

  <div class="eta-badge" id="d-eta">Estimated delivery: 15–30 min</div>

  <a class="btn-wa" href="https://wa.me/2348104063360" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Chat with us on WhatsApp
  </a>
  <a class="btn-back" href="/menu.html">Back to Menu</a>
</div>

<script>
  // Read URL params
  const params = new URLSearchParams(window.location.search);
  const ref    = params.get('ref')    || '';
  const item   = params.get('item')   || '';
  const amount = parseInt(params.get('amount') || '0', 10);
  const qty    = parseInt(params.get('qty')    || '1', 10);

  // Fill display
  if (item)   document.getElementById('d-item').textContent   = item;
  if (amount) document.getElementById('d-amount').textContent = '₦' + amount.toLocaleString('en-NG');
  if (ref)    document.getElementById('d-ref').textContent    = ref;

  // ETA
  const eta = Math.floor(Math.random() * 16) + 15;
  document.getElementById('d-eta').textContent = 'Estimated delivery: ' + eta + ' min';

  // Fire GA4 purchase event (once params are confirmed present)
  if (ref && amount) {
    gtag('event', 'purchase', {
      transaction_id: ref,
      value: amount / 100,
      currency: 'NGN',
      items: [{
        item_id: item.toLowerCase().replace(/\s+/g, '-'),
        item_name: item,
        price: amount / 100 / qty,
        quantity: qty
      }]
    });
  }
</script>
</body>
</html>
